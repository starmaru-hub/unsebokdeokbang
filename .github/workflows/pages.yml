# main 브랜치에 올리면: 엔진 검사 → app/static 폴더를 GitHub Pages 로 배포
name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 파이썬 엔진 테스트
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests -q
      - name: JS 엔진이 파이썬과 같은 결과를 내는지 대조
        run: |
          python scripts/js_parity.py parity_cases.json 120
          node scripts/js_parity.mjs parity_cases.json

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v4
